services:
  echo-task:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_ROOT: /data
      LLM_PROVIDER: deepseek
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-v4-flash
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
    volumes:
      - echo_task_data:/data
    restart: unless-stopped

volumes:
  echo_task_data:
